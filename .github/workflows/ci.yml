name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test HTML file
        run: |
          test -f index.html
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML test passed!"

      - name: Build
        run: |
          mkdir -p build
          cp index.html build/
          echo "Build completed successfully!"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: build/
